<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسوية الدعم - مدقق</title>
<meta name="theme-color" content="#1479D3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تسوية الدعم">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
<style>
  :root {
    --blue: #1479D3; --blue-2: #0F5FA8; --navy: #0B3D6E; --purple: #6C4BD8; --green: #22A04B; --red: #E0393E;
    --yellow: #F2A900; --orange: #E67E00;
    --ink: #17212E; --mute: #6B7785; --line: #DFE7F1; --bg: #F3F7FC; --card: #fff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Cairo', Tahoma, sans-serif; font-size: 15px; }
  button, input, select { font-family: inherit; font-size: inherit; }
  .hidden { display: none !important; }
  .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }

  /* ===== الانترو ===== */
  #intro { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 38%, #2A8BE0 0%, #1479D3 38%, #0B3D6E 100%); color: #fff; transition: opacity .45s ease, visibility .45s; }
  #intro.out { opacity: 0; visibility: hidden; }
  #intro .mark { position: relative; width: 210px; height: 200px; }
  #intro .mark img { position: absolute; right: 0; bottom: 6px; width: 168px; opacity: 0; transform: scale(.55); animation: logoIn .7s cubic-bezier(.2,1.4,.4,1) .15s forwards; }
  #intro .coin { position: absolute; left: 4px; top: 4px; width: 78px; height: 78px; border-radius: 50%; border: 6px solid #fff; background: #1479D3;
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 38px; line-height: 1; color: #fff;
    box-shadow: inset 0 0 0 4px #1479D3, inset 0 0 0 6px #BEDCF5, 0 10px 24px rgba(0,0,0,.25);
    opacity: 0; transform: translateY(-160px); animation: coinDrop .75s cubic-bezier(.3,1.5,.5,1) .7s forwards, coinSpin .9s ease-in-out 1.45s 1; }
  #intro .ring { position: absolute; left: 4px; top: 4px; width: 78px; height: 78px; border-radius: 50%; border: 3px solid #fff; opacity: 0; animation: ring .8s ease-out 1.35s forwards; }
  #intro h1 { margin: 0; font-size: 25px; font-weight: 900; letter-spacing: .3px; opacity: 0; transform: translateY(14px); animation: up .5s ease 1.25s forwards; }
  #intro p { margin: -8px 0 0; font-size: 14px; opacity: 0; animation: up .5s ease 1.55s forwards; color: #CFE6FA; }
  #intro .skip { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 22px); font-size: 12px; color: #A9CDEE; opacity: 0; animation: up .4s ease 1s forwards; }
  @keyframes logoIn { to { opacity: 1; transform: scale(1); } }
  @keyframes coinDrop { 0% { opacity: 1; transform: translateY(-160px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes coinSpin { 0% { transform: rotateY(0); } 100% { transform: rotateY(360deg); } }
  @keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }
  @keyframes up { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #intro * { animation-duration: .01s !important; animation-delay: 0s !important; } }

  /* ===== الدخول ===== */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: linear-gradient(160deg, #E8F2FC 0%, #F3F7FC 45%, #EFEAFD 100%); }
  .login-card { width: 100%; max-width: 380px; background: #fff; border-radius: 22px; padding: 28px 22px; box-shadow: 0 14px 40px rgba(20,121,211,.14); position: relative; overflow: hidden; }
  .login-card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 5px; background: linear-gradient(90deg, var(--blue), var(--purple), #2BB45A, var(--yellow)); }
  .login-card .app-ico { display: block; width: 74px; height: 74px; border-radius: 20px; margin: 4px auto 10px; box-shadow: 0 8px 20px rgba(20,121,211,.3); }
  .login-card h1 { text-align: center; font-size: 20px; margin: 0 0 4px; color: var(--navy); font-weight: 900; }
  .login-card .sub { text-align: center; color: var(--mute); font-size: 13px; margin-bottom: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--mute); margin-bottom: 4px; }
  .field input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; outline: none; }
  .field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(20,121,211,.12); }
  .err { color: var(--red); font-size: 13px; min-height: 20px; margin-top: 8px; text-align: center; }

  /* ===== الزراير ===== */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 800; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--blue), var(--blue-2)); box-shadow: 0 4px 12px rgba(20,121,211,.25); }
  .btn:disabled { opacity: .55; box-shadow: none; }
  .btn.block { width: 100%; }
  .btn.green { background: linear-gradient(135deg, #2BB45A, #1A8A3E); box-shadow: 0 4px 12px rgba(34,160,75,.28); }
  .btn.ghost { background: #fff; color: var(--blue); border: 1.5px solid var(--line); box-shadow: none; }
  .btn.bad { background: #fff; color: var(--red); border: 1.5px solid #F4CACA; box-shadow: none; }
  .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }

  /* ===== الهيدر ===== */
  header { position: sticky; top: 0; z-index: 20; color: #fff; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background: linear-gradient(120deg, #1479D3 0%, #2C6FD6 45%, #6C4BD8 100%); }
  .accent { position: sticky; top: var(--hh, 64px); z-index: 19; height: 4px; background: linear-gradient(90deg, var(--blue), var(--purple), #2BB45A, var(--yellow)); }
  .hrow { display: flex; align-items: center; gap: 8px; }
  .hrow .h-ico { width: 40px; height: 40px; border-radius: 12px; box-shadow: 0 0 0 2px rgba(255,255,255,.35); flex: none; }
  .hrow .title { flex: 1; min-width: 0; }
  .hrow .title b { display: block; font-size: 18px; font-weight: 900; }
  .hrow .title span { font-size: 12px; opacity: .9; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255,255,255,.18); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; text-decoration: none; }
  .icon-btn svg { width: 21px; height: 21px; }
  .strip { margin-top: 10px; }
  .strip .row { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .track { height: 6px; background: rgba(255,255,255,.28); border-radius: 99px; overflow: hidden; margin-top: 5px; }
  .strip .track i { display: block; height: 100%; width: 0; background: #fff; border-radius: 99px; transition: width .35s; }
  .strip.busy .track i { width: 35% !important; animation: ind 1.1s ease-in-out infinite; }
  @keyframes ind { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }

  main { padding: 10px 12px calc(env(safe-area-inset-bottom) + 40px); }
  .top-wrap { max-width: 760px; margin: 0 auto; }

  /* ===== المربعات ===== */
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 4px 0 12px; }
  @media (max-width: 620px) { .tiles { grid-template-columns: repeat(3, 1fr); } .tile .n { font-size: 22px; } }
  .tile { border: 0; border-radius: 16px; padding: 12px 12px 10px; color: #fff; text-align: right; cursor: pointer; position: relative; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,.10); transition: transform .15s; }
  .tile:active { transform: scale(.97); }
  .tile::after { content: ''; position: absolute; left: -18px; bottom: -26px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .tile .n { font-size: 26px; font-weight: 900; line-height: 1.1; display: block; }
  .tile .l { font-size: 12.5px; font-weight: 700; opacity: .95; }
  .tile .e { position: absolute; left: 10px; top: 8px; font-size: 20px; opacity: .9; }
  .tile { opacity: .55; filter: saturate(.75); }
  .tile.on { opacity: 1; filter: none; outline: 3px solid #fff; box-shadow: 0 0 0 3px rgba(20,121,211,.55), 0 8px 18px rgba(0,0,0,.16); }
  .t-q { background: linear-gradient(135deg, #FF9F1C, #E67E00); }
  .t-p { background: linear-gradient(135deg, #1E90FF, #0F5FA8); }
  .t-d { background: linear-gradient(135deg, #2BB45A, #1A8A3E); }
  .t-b { background: linear-gradient(135deg, #F0504F, #C62828); }
  .t-c { background: linear-gradient(135deg, #F0504F, #C62828); }
  .t-m { background: linear-gradient(135deg, #8B6CF0, #5B3CC4); }
  /* شاشة مشاكل الاتصال وشاشة الرصيد */
  .prob { margin: 6px 0 8px; background: linear-gradient(135deg, #FDECEC, #FBDADA); border: 1.5px solid #F2B3B3; color: #B71C1C; border-radius: 12px; padding: 10px; font-size: 13px; font-weight: 800; line-height: 1.7; }
  .prob small { display: block; color: #9A4A4A; font-weight: 700; font-size: 11.5px; margin-top: 4px; }
  .prob-btn { width: 100%; }
  .money { margin: 6px 0 8px; background: #fff; border: 1.5px solid #E1D8FB; border-radius: 12px; padding: 8px 10px; }
  .money .ln { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; padding: 3px 0; color: #36414F; }
  .money .ln b { font-weight: 900; white-space: nowrap; }
  .money .ln.short { border-top: 1px dashed #D6CBF7; margin-top: 4px; padding-top: 7px; color: #C62828; font-size: 14.5px; }
  .money .hint { font-size: 11.5px; color: var(--mute); margin-top: 6px; line-height: 1.6; }
  .trow { display: flex; gap: 8px; align-items: baseline; font-size: 12px; padding: 6px 2px; border-bottom: 1px solid #EEF2F8; }
  .trow .a { font-weight: 900; white-space: nowrap; }
  .trow .n { color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .bar input { flex: 1; min-width: 0; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 12px; outline: none; background: #fff; }
  .bar input:focus { border-color: var(--blue); }
  .flt { font-size: 12.5px; color: var(--mute); margin: -4px 2px 8px; }
  .flt a { color: var(--blue); cursor: pointer; font-weight: 700; }

  /* ===== لوحة المحلات (عمود لكل محل) ===== */
  #board { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding: 4px 2px 14px; -webkit-overflow-scrolling: touch; }
  #board { scrollbar-width: none; }
  #board::-webkit-scrollbar { display: none; }
  /* شريط التحكم يمين وشمال (ثابت تحت الشاشة) */
  #hbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; align-items: center; gap: 8px; padding: 6px 10px calc(env(safe-area-inset-bottom) + 6px);
    background: rgba(255,255,255,.94); backdrop-filter: blur(6px); border-top: 1px solid #E1E8F1; box-shadow: 0 -4px 14px rgba(16,40,80,.08); }
  #hbar button { width: 36px; height: 30px; border-radius: 10px; border: 0; color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; flex: none;
    background: linear-gradient(135deg, var(--blue), var(--purple)); box-shadow: 0 3px 8px rgba(20,121,211,.25); }
  #hbar button:disabled { opacity: .35; box-shadow: none; }
  #hscroll { flex: 1; overflow-x: auto; overflow-y: hidden; height: 16px; direction: rtl; }
  #hscroll div { height: 1px; }
  #hscroll::-webkit-scrollbar { height: 12px; }
  #hscroll::-webkit-scrollbar-track { background: #EEF3F9; border-radius: 99px; }
  #hscroll::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #6FA8E6, #8B6CF0); border-radius: 99px; }
  #hbar .pos { font-size: 11.5px; color: var(--mute); font-weight: 700; white-space: nowrap; flex: none; }
  main { padding-bottom: calc(env(safe-area-inset-bottom) + 64px) !important; }
  .col { flex: 0 0 262px; background: #fff; border-radius: 16px; border: 1px solid #E6EDF6; border-top: 5px solid var(--c1); box-shadow: 0 3px 12px rgba(16,40,80,.07); overflow: hidden; }
  @media (max-width: 560px) { .col { flex-basis: 78vw; } }
  .col .hd { padding: 10px 11px 9px; background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 13%, #fff), #fff); border-bottom: 1px solid #EEF2F8; }
  .col .r1 { display: flex; align-items: center; gap: 7px; }
  .col .r1 b { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col .r1 b::before { content: '●'; color: var(--c1); font-size: 11px; margin-left: 5px; vertical-align: 2px; }
  .col .cnt { min-width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 13px; padding: 0 6px;
    background: linear-gradient(135deg, var(--c1), var(--c2)); flex: none; }
  .col .cnt.z { background: #E3E9F1; color: var(--mute); }
  .col .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 7px; }
  .chip { font-size: 11px; font-weight: 800; border-radius: 99px; padding: 1px 8px; border: 1px solid transparent; }
  .chip.z { opacity: .5; }
  .ch-q { background: #FFF1DE; color: #B35F00; border-color: #F6D9AE; }
  .ch-p { background: #E4F0FD; color: #0F5FA8; border-color: #C3DDF8; }
  .ch-d { background: #E5F6EB; color: #1A8A3E; border-color: #BFE5CB; }
  .col .r3 { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .col .r3 .sp { flex: 1; }
  .bal { font-weight: 900; font-size: 12.5px; border-radius: 9px; padding: 2px 8px; white-space: nowrap; }
  .bal.zero { background: #E5F6EB; color: #1A8A3E; }
  .bal.nz { background: #FDECEC; color: #C62828; }
  .bal.na { background: #F0F3F7; color: var(--mute); }
  .mini { border: 1.5px solid var(--line); background: #fff; color: var(--blue); border-radius: 9px; padding: 3px 9px; font-size: 12px; font-weight: 800; cursor: pointer; }
  .mini:disabled { opacity: .5; }
  a.mini { text-decoration: none; display: inline-block; }
  .col .bd { padding: 4px 8px 10px; background: #FBFCFE; min-height: 56px; }
  .col .zero-note { text-align: center; color: #A0ABB8; font-size: 12.5px; padding: 16px 6px 8px; }
  .col .zero-note b { display: block; font-size: 22px; color: #C9D2DD; }
  .col .cfm { position: sticky; bottom: 0; padding: 8px; background: #fff; border-top: 1px solid #EEF2F8; }
  .col .cfm .btn { width: 100%; }
  .empty { text-align: center; color: var(--mute); padding: 26px 12px; }
  .scr-title { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; margin: 2px 2px 8px; }
  .scr-title small { color: var(--mute); font-weight: 600; font-size: 12.5px; }

  /* ===== الحركات ===== */
  .mv { border-radius: 12px; padding: 9px 9px; margin: 7px 0; border: 1.5px solid #CFE3FA; background: linear-gradient(90deg, #fff, #F5FAFF); display: flex; gap: 10px; align-items: flex-start; }
  .mv.warn { border-color: #F6C9C9; background: linear-gradient(90deg, #fff, #FFF6F6); }
  .mv input[type=checkbox] { width: 22px; height: 22px; margin-top: 3px; flex: none; accent-color: var(--green); }
  .mv .body { flex: 1; min-width: 0; }
  .top { display: flex; align-items: baseline; gap: 8px; }
  .top b { flex: 1; font-size: 14px; }
  .amt { font-weight: 900; font-size: 15px; }
  .meta { color: var(--mute); font-size: 12px; margin-top: 2px; line-height: 1.65; word-break: break-word; }
  .will { margin-top: 6px; font-size: 13.5px; }
  .pill { display: inline-block; border-radius: 99px; padding: 0 10px; font-size: 12.5px; font-weight: 800; color: #fff; }
  .op-in { background: linear-gradient(135deg, #2BB45A, #1A8A3E); }
  .op-out { background: linear-gradient(135deg, #F0504F, #C62828); }
  .op-tr { background: linear-gradient(135deg, #8B6CF0, #5B3CC4); }
  /* التسجيل حركة حركة */
  .cprog { margin-top: 7px; }
  .cprog .bar { height: 7px; background: #E5EEF8; border-radius: 99px; overflow: hidden; }
  .cprog .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2BB45A, #1E90FF); border-radius: 99px; transition: width .35s; }
  .cprog span { display: block; margin-top: 4px; font-size: 12px; font-weight: 800; color: var(--mute); text-align: center; }
  .card .cstat { margin: 0 9px 8px; font-size: 12px; font-weight: 800; border-radius: 8px; padding: 3px 8px; line-height: 1.6; }
  .cstat.run { background: #E4F0FD; color: #0F5FA8; }
  .cstat.ok { background: #E5F6EB; color: #1A8A3E; }
  .cstat.bad { background: #FDECEC; color: #C62828; }
  .card.c-ok { border-color: #8FD3A6 !important; background: linear-gradient(90deg, #fff, #EEFAF2) !important; }
  .card.c-bad { border-color: #F2A9A9 !important; }
  .op-sup { background: linear-gradient(135deg, #26A69A, #00796B); }
  .card .kw { width: 100%; padding: 8px; border: 1.5px solid #EBD7B4; border-radius: 10px; background: #fff; margin: -2px 0 8px; font-family: inherit; }
  .card.cd.cxl { border-color: #C3DDF8; background: linear-gradient(90deg, #fff, #F2F8FF); }
  .card.cxl .tag { background: #E4F0FD; color: #0F5FA8; }
  .wmsg { margin-top: 6px; font-size: 12.5px; font-weight: 800; color: #C62828; background: #FDECEC; border-radius: 10px; padding: 5px 9px; }

  /* ===== الكروت المختصرة ===== */
  .card { border-radius: 12px; margin: 7px 0; border: 1.5px solid #E1E8F1; background: #fff; overflow: hidden; }
  .card .sum { display: flex; align-items: center; gap: 7px; padding: 8px 9px; cursor: pointer; }
  .card .dir { width: 24px; height: 24px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #fff; }
  .dir.out { background: linear-gradient(135deg, #F0504F, #C62828); }
  .dir.in { background: linear-gradient(135deg, #2BB45A, #1A8A3E); }
  .card .tx { flex: 1; min-width: 0; }
  .card .tx .a { font-weight: 900; font-size: 15px; display: block; line-height: 1.3; }
  .card .tx .n { display: block; font-size: 12.5px; color: #4A5868; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .chev { width: 18px; height: 18px; color: #A0ABB8; flex: none; transition: transform .2s; }
  .card.open .chev { transform: rotate(180deg); }
  .card .more { display: none; padding: 0 9px 9px; border-top: 1px dashed #E6ECF3; }
  .card.open .more { display: block; }
  .scr-title .mini { margin-inline-start: auto; }
  .card .will { margin: 0; padding: 0 9px 8px 9px; font-size: 12.5px; }
  .card .wshort { margin: 0 9px 8px; font-size: 11.5px; font-weight: 800; color: #C62828; background: #FDECEC; border-radius: 8px; padding: 3px 8px; }
  .card input.pick { width: 21px; height: 21px; flex: none; accent-color: var(--green); margin: 0; }
  .card.cq { border-color: #F3D9AE; background: linear-gradient(135deg, #FFFCF6, #FFF6E8); }
  .card.cp { border-color: #CFE3FA; background: linear-gradient(90deg, #fff, #F6FAFF); }
  .card.cp.warn { border-color: #F6C9C9; background: linear-gradient(90deg, #fff, #FFF6F6); }
  .card.cd { border-color: #BFE5CB; background: linear-gradient(90deg, #fff, #F1FBF4); }
  .card.cd.rej { border-color: #F4CACA; background: linear-gradient(90deg, #fff, #FFF5F5); }
  .card .tag { font-size: 11px; font-weight: 800; border-radius: 99px; padding: 0 8px; background: #E5F6EB; color: #1A8A3E; white-space: nowrap; flex: none; }
  .card.rej .tag { background: #FDECEC; color: #C62828; }
  .card .q-msg { color: #B35F00; font-weight: 800; font-size: 12.5px; margin: 7px 0; }
  .card .ctrls { display: grid; gap: 6px; }
  .card select { width: 100%; padding: 8px; border: 1.5px solid #EBD7B4; border-radius: 10px; background: #fff; }
  .card .rule { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mute); margin: 7px 0; }
  .card .rule input { width: 17px; height: 17px; accent-color: var(--orange); }
  .card .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .card .btns .btn { flex: 1; min-width: 60px; padding: 7px 6px; }
  /* تنبيه المحل */

  /* ===== نوافذ ===== */
  .modal-bg { position: fixed; inset: 0; z-index: 90; background: rgba(11,30,55,.45); display: flex; align-items: flex-end; justify-content: center; }

  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px); transform: translateX(-50%); background: #1B2430; color: #fff; padding: 10px 18px; border-radius: 14px; z-index: 100; max-width: 92vw; text-align: center; font-size: 14px; box-shadow: 0 8px 22px rgba(0,0,0,.22); line-height: 1.7; }
  #toast.ok { background: linear-gradient(135deg, #2BB45A, #1A8A3E); }
  #toast.bad { background: linear-gradient(135deg, #F0504F, #C62828); }

  #installHelp .box { background: #fff; border-radius: 18px; padding: 20px; max-width: 360px; line-height: 2; font-size: 15px; }
  #installHelp h3 { margin: 0 0 8px; color: var(--navy); }
</style>
</head>
<body>

<!-- الانترو -->
<div id="intro">
  <div class="mark">
    <img src="logo-white.png" alt="">
    <div class="ring"></div>
    <div class="coin">ج</div>
  </div>
  <h1>تسوية خزنة الدعم</h1>
  <p>مدقق</p>
  <div class="skip">دوس في أي حتة للتخطي</div>
</div>

<!-- الدخول -->
<section id="login" class="hidden">
  <div class="login-card">
    <img class="app-ico" src="icon-192.png" alt="">
    <h1>تسوية خزنة الدعم</h1>
    <div class="sub">مدقق — عكس حركات خزنة «خاص بالدعم»</div>
    <form id="loginForm" autocomplete="on">

      <div class="field"><label>كلمة السر</label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <button class="btn block" id="lBtn" type="submit">دخول</button>
      <div class="err" id="lErr"></div>

    <button class="btn ghost block" style="margin-top:12px" id="installBtn2" type="button">📲 تثبيت التطبيق على الموبايل</button>

<!-- الشاشة الرئيسية -->
<section id="main" class="hidden">

    <div class="hrow">
      <img class="h-ico" src="icon-192.png" alt="">
      <div class="title"><b>تسوية الدعم</b><span id="who"></span></div>
      <button class="icon-btn hidden" id="installBtn" title="تثبيت التطبيق على الموبايل">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3"/><path d="M10.5 18.5h3"/></svg>
      </button>

      </a>
      <button class="icon-btn" id="btnRefresh" title="تحديث">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="btnOut" title="خروج">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M8 7l-5 5 5 5"/><path d="M3 12h12"/></svg>
      </button>
    </div>

      <div class="row" id="stripT"></div>

  <div class="accent"></div>

  <main>
    <div class="top-wrap">
      <div class="tiles">
        <button class="tile t-q" data-s="q"><span class="e">❓</span><span class="n num" id="nQ">0</span><span class="l">الاستفسارات</span></button>
        <button class="tile t-p" data-s="p"><span class="e">⏳</span><span class="n num" id="nP">0</span><span class="l">مستني تأكيد</span></button>
        <button class="tile t-d" data-s="d"><span class="e">✅</span><span class="n num" id="nD">0</span><span class="l">اتعمل النهارده</span></button>
        <button class="tile t-c" data-s="c"><span class="e">🔌</span><span class="n num" id="nC">0</span><span class="l">مشاكل الاتصال</span></button>
        <button class="tile t-m" data-s="m"><span class="e">💰</span><span class="n num" id="nM">0</span><span class="l">رصيد مش مكفي</span></button>
      </div>
      <div class="bar">
        <input id="q" type="search" placeholder="🔎 دوّر باسم المحل" autocomplete="off">

  <div id="hbar" class="hidden">

    <div id="hscroll"><div id="hsIn"></div></div>

    <span class="pos num" id="hPos"></span>
  </div>
</section>

<div id="toast" class="hidden"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzkq1qgQSlTt1Tg67k6yvFowaZ7lEJPfoVsL3mSrun8I6Vx9CdKCHQpoLYTlNHu7Sg/exec';
const PALETTE = [['#FF9F1C','#E67E00'],['#1E90FF','#0F5FA8'],['#2BB45A','#1A8A3E'],['#8B6CF0','#5B3CC4'],['#F06292','#C2185B'],['#26A69A','#00796B'],['#F0504F','#C62828'],['#00ACC1','#00838F'],['#7E57C2','#4527A0'],['#5B6B7E','#36414F']];
const OP_CLASS = { 'إيراد': 'op-in', 'مصروف': 'op-out', 'تحويل': 'op-tr', 'إيصال صرف لمورد': 'op-sup', 'إيصال استلام من مورد': 'op-sup' };
const SUP_OPS = ['إيصال صرف لمورد', 'إيصال استلام من مورد'];
const DEFAULT_SUPPLIER = 'ابو سمرة';
// عكس إيصال الصرف بيرجّع فلوس للخزنة، وعكس الاستلام بيطلّع فلوس
function opsFor(m) {
  const out = /صرف/.test(m.vtype || '') ? true : /استلام/.test(m.vtype || '') ? false : ['إيراد', 'تحويل', 'إيصال استلام من مورد'].includes(m.op);
  return out ? ['إيراد', 'تحويل', 'إيصال استلام من مورد'] : ['مصروف', 'إيصال صرف لمورد'];
}
// اقتراح للكلمة: الملاحظة من غير أرقام الفواتير والتواريخ
function suggestKw(note) {
  return shortNote(note).split(/\s+(?:ف\s*-?\s*\d|رقم\s*\d|\d{3,}|\d{1,2}\/\d{1,2})/)[0].trim() || shortNote(note);
}

const $ = id => document.getElementById(id);
const st = { state: null, items: {}, busy: false, screen: 'q', q: '', closedCards: new Set(), errs: {}, cprog: {}, hid: {} };
const SCREENS = { q: { t: '❓ الاستفسارات', z: 'مفيش استفسارات' }, p: { t: '⏳ مستني تأكيد', z: 'مفيش حركات مستنية' }, d: { t: '✅ اتعمل النهارده', z: 'لسه مفيش' }, c: { t: '🔌 مشاكل الاتصال', z: 'مفيش مشاكل' }, m: { t: '💰 رصيد خزنة التحصيل مش مكفي', z: 'الرصيد مكفي' } };

// ---------- أدوات ----------
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(t, kind) { const el = $('toast'); el.textContent = t; el.className = kind || ''; clearTimeout(el._t); el._t = setTimeout(() => el.classList.add('hidden'), kind === 'bad' ? 6500 : 3500); }
function money(v) { const n = Number(v); return isNaN(n) ? esc(v) : n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function norm(s) { return String(s || '').replace(/[ً-ْـ]/g, '').replace(/[إأآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ').trim().toLowerCase(); }
function today() { const d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function hash(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function arErr(e) {
  const m = (e && e.message) ? e.message : String(e || '');
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'مفيش نت أو السيرفر مش بيرد - جرّب تاني';
  if (/JSON|Unexpected token/i.test(m)) return 'السيرفر رد رد غريب - جرّب كمان شوية';
  return /[a-z]{4,}/i.test(m) && !/[؀-ۿ]/.test(m) ? 'حصلت مشكلة - جرّب تاني' : m;
}
async function api(action, data) {
  const body = Object.assign({ name: ls('tsw_name') || '', password: ls('tsw_pass') || '' }, data || {});
  const res = await fetch(API + '?action=' + action, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await res.json();
  if (!j.ok) {
    const err = new Error(j.error || 'حصلت مشكلة');
    if (/كلمة السر غلط|مش نشط/.test(j.error || '')) err.auth = true;
    throw err;
  }
  return j.data;
}
function strip(text, pct) {
  const s = $('strip');
  if (text === null) { s.classList.add('hidden'); hh(); return; }
  s.classList.remove('hidden');
  $('stripT').textContent = text;
  const i = $('stripI');
  if (pct === undefined) { s.classList.add('busy'); i.style.width = ''; }
  else { s.classList.remove('busy'); i.style.width = Math.round(pct) + '%'; }
  hh();
}
function hh() { document.documentElement.style.setProperty('--hh', ($('hdr').offsetHeight || 64) + 'px'); }
function ask(title, msg, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3><p>' + msg + '</p>' +
      (opts.input ? '<input id="askIn" placeholder="' + esc(opts.input) + '">' : '') +
      '<div class="btns"><button class="btn ' + (opts.danger ? 'bad' : 'green') + '" id="askYes">' + esc(opts.yes || 'تمام') + '</button>' +
      '<button class="btn ghost" id="askNo">رجوع</button></div></div>';
    document.body.appendChild(bg);
    const done = v => { bg.remove(); resolve(v); };
    bg.querySelector('#askYes').onclick = () => done(opts.input ? (bg.querySelector('#askIn').value || '') : true);
    bg.querySelector('#askNo').onclick = () => done(opts.input ? null : false);
    bg.addEventListener('click', e => { if (e.target === bg) done(opts.input ? null : false); });
  });
}

// ---------- الانترو (كل مرة التطبيق يتفتح) ----------
(function intro() {
  const el = $('intro');
  let gone = false;
  const hide = () => { if (gone) return; gone = true; el.classList.add('out'); setTimeout(() => el.remove(), 500); };
  el.addEventListener('click', hide);
  setTimeout(hide, 2700);
})();

// ---------- الدخول ----------
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('lErr').textContent = '';
  $('lBtn').disabled = true; $('lBtn').textContent = 'بيدخل...';
  ls('tsw_name', $('lName').value.trim()); ls('tsw_pass', $('lPass').value.trim());
  try {
    const r = await api('login', {});
    ls('tsw_user', JSON.stringify(r));
    afterLogin(r);
  } catch (err) {
    ls('tsw_pass', null);
    $('lErr').textContent = arErr(err);
  } finally {
    $('lBtn').disabled = false; $('lBtn').textContent = 'دخول';
  }
});
function showLogin() {
  $('main').classList.add('hidden'); $('login').classList.remove('hidden'); $('hbar').classList.add('hidden');
  $('lName').value = ls('tsw_name') || '';
  showInstall();
}
function afterLogin(r) {
  $('login').classList.add('hidden'); $('main').classList.remove('hidden');
  $('who').textContent = r.name || '';
  if (r.sheetUrl) { $('sheetBtn').href = r.sheetUrl; $('sheetBtn').classList.remove('hidden'); }
  if (SCREENS[ls('tsw_screen')]) st.screen = ls('tsw_screen');
  try { st.errs = JSON.parse(ls('tsw_errs') || '{}') || {}; } catch (e) { st.errs = {}; }
  try { st.hid = JSON.parse(ls('tsw_hid') || '{}') || {}; } catch (e) { st.hid = {}; }
  try { st.closedCards = new Set(JSON.parse(ls('tsw_closed') || '[]')); } catch (e) { st.closedCards = new Set(); }
  showInstall(); hh();
  load();
}
$('btnOut').onclick = async () => {
  if (!(await ask('خروج', 'هتخرج من التطبيق على الموبايل ده. متأكد؟', { yes: 'خروج', danger: true }))) return;
  ls('tsw_pass', null); ls('tsw_user', null);
  st.state = null;
  showLogin();
};

// ---------- التحميل ----------
async function load(quiet) {
  if (!quiet) strip('جاري التحميل...');
  try {
    st.state = await api('state', {});
    render();
  } catch (e) {
    if (e.auth) { ls('tsw_pass', null); showLogin(); $('lErr').textContent = arErr(e); return; }
    toast(arErr(e), 'bad');
  } finally {
    if (!quiet && !st.busy) strip(null);
  }
}
$('btnRefresh').onclick = () => { if (!st.busy) load(); };

// ---------- تجميع البيانات لكل محل ----------
function shopsData() {
  const s = st.state; const t = today();
  const map = {};
  s.branches.forEach(b => { map[b.name] = { b: b, q: [], p: [], d: [] }; });
  const get = n => map[n] || (map[n] = { b: { name: n, balance: '', scanned: '', last: '' }, q: [], p: [], d: [] });
  s.open.forEach(m => {
    if (m.status === 'استفسار' || m.status === 'خطأ') get(m.branch).q.push(m);
    else if (m.status === 'مقترح' || m.status === 'جاري التنفيذ') get(m.branch).p.push(m);
  });
  (s.recent || []).forEach(m => { if (String(m.doneAt || '').slice(0, 10) === t) get(m.branch).d.push(m); });
  const all = Object.values(map);
  all.forEach(x => { x.c = probOf(x.b); x.m = shortOf(x); });
  return all;
}
// مشكلة الاتصال: اللي السيرفر حافظها (من آخر فحص)، ولو مفيش فاللي حصلت على الجهاز ده
function probOf(b) {
  const s = String(b.err || ''), i = s.indexOf(' | ');
  if (s) return { msg: i > 0 ? s.slice(i + 3) : s, at: i > 0 ? s.slice(11, 16) : '', when: i > 0 ? s.slice(0, 16) : '', key: s, srv: true };
  const l = st.errs[b.name];
  return l ? { msg: l.msg, at: l.at, when: '', key: 'l:' + l.msg, srv: false } : null;
}
// رصيد خزنة التحصيل مقابل التحويلات اللي مستنية
function shortOf(x) {
  const col = norm(st.state.collect || 'تحصيل خاص بالمخزن');
  const mv = x.p.concat(x.q).filter(m => m.op === 'تحويل' && norm(m.item) === col && ['مقترح', 'خطأ', 'جاري التنفيذ'].includes(m.status));
  if (!mv.length) return null;
  const need = mv.reduce((a, m) => a + (Number(m.amount) || 0), 0);
  let bal = x.b.coll === '' || x.b.coll == null ? NaN : Number(x.b.coll);
  if (isNaN(bal)) {   // لحد ما الفرع يتفحص تاني: الرصيد من رسالة التحذير
    for (const m of mv) { const r = /فيها\s+(-?[\d,]+(?:\.\d+)?)\s+بس/.exec(m.msg || ''); if (r) { bal = Number(r[1].replace(/,/g, '')); break; } }
  }
  if (isNaN(bal)) return null;
  const short = need - bal;
  return short > 0.004 ? { bal: bal, need: need, short: short, mv: mv } : null;
}
function setErr(br, msg) {
  if (msg) st.errs[br] = { msg: msg, at: new Date().toTimeString().slice(0, 5) }; else delete st.errs[br];
  ls('tsw_errs', JSON.stringify(st.errs));
}
function shortNote(n) { return String(n || '').split(/\s*[,،]\s*تم الت[اأ]ك[ي]?د/)[0].trim() || '—'; }
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function sumRow(m, lead, tail) {
  const out = m.vtype ? /صرف/.test(m.vtype) : (m.op === 'إيراد' || m.op === 'تحويل');
  return '<div class="sum" data-card="' + esc(m.id) + '">' + (lead || '') +
    '<span class="dir ' + (out ? 'out' : 'in') + '" title="' + esc(m.vtype) + '">' + (out ? '↑' : '↓') + '</span>' +
    '<span class="tx"><span class="a num">' + money(m.amount) + '</span><span class="n" title="' + esc(m.note) + '">' + esc(shortNote(m.note)) + '</span></span>' +
    (tail || '') + CHEV + '</div>';
}
function balClass(v) { if (v === '' || v == null) return 'na'; return Number(v) === 0 ? 'zero' : 'nz'; }

// ---------- الرسم: 3 شاشات، وفي كل شاشة عمود لكل محل ----------
function render() {
  if (!st.state) return;
  const all = shopsData();
  const sum = k => all.reduce((a, x) => a + x[k].length, 0);
  $('nQ').textContent = sum('q'); $('nP').textContent = sum('p'); $('nD').textContent = sum('d');
  $('nC').textContent = all.filter(x => x.c).length; $('nM').textContent = all.filter(x => x.m).length;
  document.querySelectorAll('.tile').forEach(t => t.classList.toggle('on', t.dataset.s === st.screen));
  const k = st.screen;

  // شاشة مشاكل الاتصال وشاشة الرصيد: الفروع اللي فيها المشكلة بس
  if (k === 'c' || k === 'm') {
    const fq = norm(st.q);
    const fl = all.filter(x => x[k] && (!fq || norm(x.b.name).includes(fq)));
    fl.sort((a, b) => k === 'm' ? b.m.short - a.m.short : a.b.name.localeCompare(b.b.name, 'ar'));
    const tot = k === 'm' ? fl.reduce((a, x) => a + x.m.short, 0) : 0;
    $('scrTitle').innerHTML = SCREENS[k].t + ' <small>— ' + fl.length + ' فرع' + (tot ? ' — الناقص كله <span class="num">' + money(tot) + '</span>' : '') + '</small>';
    $('board').innerHTML = fl.length ? fl.map(x => column(x, k)).join('') :
      '<div class="empty">' + (st.q ? 'مفيش فروع بالاسم ده' : k === 'c' ? '👌 كل الفروع شغالة ومفيش مشاكل اتصال' : '👌 مفيش فرع رصيد خزنة التحصيل بتاعه ناقص') + '</div>';
    wire();
    hbarSync();
    return;
  }

  const qn = norm(st.q);
  const list = all.filter(x => !qn || norm(x.b.name).includes(qn));
  list.sort((a, b) => (b[k].length - a[k].length) || (b.q.length + b.p.length - a.q.length - a.p.length) ||
    ((balClass(b.b.balance) === 'nz') - (balClass(a.b.balance) === 'nz')) || a.b.name.localeCompare(b.b.name, 'ar'));
  const busy = list.filter(x => x[k].length).length;
  const ids = []; list.forEach(x => x[k].forEach(m => ids.push(m.id)));
  const anyOpen = ids.some(id => !st.closedCards.has(id));
  $('scrTitle').innerHTML = SCREENS[k].t + ' <small>— ' + busy + ' محل فيه حاجة من ' + list.length + '</small>' +
    (ids.length ? '<button class="mini" id="togAll">' + (anyOpen ? '⇕ قفل الكل' : '⇕ فتح الكل') + '</button>' : '');
  if (ids.length) $('togAll').onclick = () => { ids.forEach(id => anyOpen ? st.closedCards.add(id) : st.closedCards.delete(id)); saveClosed(); render(); };

  $('board').innerHTML = list.length ? list.map(x => column(x, k)).join('') :
    '<div class="empty">مفيش محلات ' + (st.q ? 'بالاسم ده' : '— فعّل الفروع من تاب «الفروع» في الشيت') + '</div>';
  wire();
  hbarSync();
}

// ---------- التحكم يمين وشمال ----------
function colStep() { const c = document.querySelector('.col'); return c ? (c.offsetWidth + 12) * Math.max(1, Math.floor($('board').clientWidth / (c.offsetWidth + 12)) - 1) : 300; }
function hbarSync() {
  const b = $('board'), over = b.scrollWidth > b.clientWidth + 4;
  $('hbar').classList.toggle('hidden', !over || $('main').classList.contains('hidden'));
  if (!over) return;
  $('hsIn').style.width = b.scrollWidth + 'px';
  if (Math.abs($('hscroll').scrollLeft - b.scrollLeft) > 1) $('hscroll').scrollLeft = b.scrollLeft;
  hbarPos();
}
function hbarPos() {
  const b = $('board'), max = b.scrollWidth - b.clientWidth, x = Math.abs(b.scrollLeft);
  $('hR').disabled = x < 4; $('hL').disabled = x > max - 4;
  const c = document.querySelector('.col'), w = c ? c.offsetWidth + 12 : 1, total = document.querySelectorAll('.col').length;
  const first = Math.min(total, Math.round(x / w) + 1), last = Math.min(total, first + Math.max(1, Math.floor(b.clientWidth / w)) - 1);
  $('hPos').textContent = first + '–' + last + ' من ' + total;
}
// مزامنة اللوحة مع الشريط: الشريط بيحرك اللوحة بس لما إنت اللي ماسكه
let hsUser = false, hsT = 0;
const hsOn = () => { hsUser = true; clearTimeout(hsT); };
const hsOff = () => { clearTimeout(hsT); hsT = setTimeout(() => { hsUser = false; }, 250); };
$('hscroll').addEventListener('pointerdown', hsOn);
window.addEventListener('pointerup', hsOff);
$('board').addEventListener('scroll', () => { if (!hsUser) $('hscroll').scrollLeft = $('board').scrollLeft; hbarPos(); }, { passive: true });
$('hscroll').addEventListener('scroll', () => { if (hsUser) $('board').scrollLeft = $('hscroll').scrollLeft; }, { passive: true });
// RTL: الشمال = المحلات اللي بعد
function hMove(dx) {
  const b = $('board'), from = b.scrollLeft;
  b.scrollBy({ left: dx, behavior: 'smooth' });
  setTimeout(() => { if (Math.abs(b.scrollLeft - from) < 2) b.scrollLeft = from + dx; }, 350); // لو الحركة الناعمة ما اشتغلتش
}
$('hL').onclick = () => hMove(-colStep());
$('hR').onclick = () => hMove(colStep());
document.addEventListener('keydown', e => {
  if ($('main').classList.contains('hidden') || e.target.closest('input,select,textarea') || document.querySelector('.modal-bg')) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); $('hL').click(); }

});
// عجلة الماوس فوق الشريط تحرك يمين وشمال
$('hbar').addEventListener('wheel', e => { e.preventDefault(); $('board').scrollBy({ left: e.deltaX || -e.deltaY }); }, { passive: false });
// وفوق رأس العمود أو أي حتة فاضية في اللوحة كمان، وShift + البكرة من أي مكان
document.addEventListener('wheel', e => {
  if ($('main').classList.contains('hidden') || document.querySelector('.modal-bg') || e.target.closest('#hbar')) return;
  const b = $('board');
  if (b.scrollWidth <= b.clientWidth + 4) return;
  const onCards = e.target.closest('.col .bd, .col .cfm') && !e.target.closest('.zero-note');
  if (!e.shiftKey && (!e.target.closest('#board') || onCards)) return;
  const unit = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? b.clientWidth : 1;
  const d = (e.shiftKey ? -(e.deltaX || e.deltaY) : Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : -e.deltaY) * unit;
  if (!d) return;
  e.preventDefault();
  b.scrollLeft += d;
}, { passive: false });

function column(x, k) {

  const bal = b.balance === '' || b.balance == null ? '—' : money(b.balance);

}

function wire() {
  document.querySelectorAll('[data-scan]').forEach(b => b.onclick = () => scanList([b.dataset.scan]));
  document.querySelectorAll('[data-confirm]').forEach(b => b.onclick = () => confirmBranch(b.dataset.confirm, b));
  document.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => reject(b.dataset.reject));
  document.querySelectorAll('[data-card]').forEach(h => h.onclick = e => {
    if (e.target.closest('input,button,select')) return;
    const id = h.dataset.card, card = h.parentElement;
    if (!st.closedCards.has(id)) { st.closedCards.add(id); card.classList.remove('open'); }
    else { st.closedCards.delete(id); card.classList.add('open'); if (card.classList.contains('q')) loadItems(card.dataset.branch, false); }

  });
  document.querySelectorAll('[data-clr]').forEach(b => b.onclick = () => {

    if (x && x.c && x.c.srv) { st.hid[nm] = x.c.key; ls('tsw_hid', JSON.stringify(st.hid)); }   // يرجع يظهر لو حصلت مشكلة جديدة
    setErr(nm, null); render();

  const cards = Array.from(document.querySelectorAll('.q'));
  const brs = {};
  cards.forEach(c => {

    c.querySelector('.q-rule').onchange = e => { const k = c.querySelector('.kw'); k.classList.toggle('hidden', !e.target.checked); if (e.target.checked) k.focus(); };
    c.querySelector('.q-yes').onclick = () => answer(c);

document.querySelectorAll('.tile').forEach(t => t.onclick = () => { st.screen = t.dataset.s; ls('tsw_screen', st.screen); render(); $('board').scrollLeft = 0; });
$('q').addEventListener('input', () => { st.q = $('q').value; render(); });

async function loadItems(br, force) {
  const cards = () => Array.from(document.querySelectorAll('.q')).filter(c => c.dataset.branch === br);
  if (st.items[br] && !force) { cards().forEach(fillItems); return; }
  if (st.errs[br] && !force) return; // المحل فيه مشكلة دخول: نستنى «تحديث البنود» بدل ما نكرر الطلب
  if (st._loadingItems && st._loadingItems[br] && !force) return;
  st._loadingItems = st._loadingItems || {}; st._loadingItems[br] = true;
  cards().forEach(c => c.querySelector('.q-item').innerHTML = '<option value="">جاري تحميل البنود...</option>');
  try {
    st.items[br] = await api('items', { branch: br, force: !!force });
    if (st.errs[br]) { setErr(br, null); render(); return; }
    cards().forEach(fillItems);
  } catch (e) {
    cards().forEach(c => c.querySelector('.q-item').innerHTML = '<option value="">مقدرتش أحمّل البنود</option>');
    setErr(br, arErr(e)); render();
  } finally { st._loadingItems[br] = false; }
}
function fillItems(c) {
  const op = c.querySelector('.q-op').value;
  const list = (st.items[c.dataset.branch] || {})[op] || [];
  const want = c.dataset.want;
  const isSup = SUP_OPS.includes(op);
  const ph = op === 'تحويل' ? '— اختار الخزنة اللي هيتحوّل منها —' : isSup ? '— اختار المورد —' : '— اختار البند —';
  // المورد: «ابو سمرة» متختار جاهز لو مفيش اختيار تاني
  let pick = list.find(t => t === want) || (isSup ? list.find(t => norm(t).replace(/\s/g, '') === norm(DEFAULT_SUPPLIER).replace(/\s/g, '')) : null) || '';
  c.querySelector('.q-item').innerHTML = '<option value="">' + ph + '</option>' +
    list.map(t => '<option' + (t === pick ? ' selected' : '') + '>' + esc(t) + '</option>').join('');
}

// ---------- العمليات ----------
async function scanList(names) {
  if (st.busy) return;
  if (!names.length) return toast('مفيش فروع مفعّلة', 'bad');
  st.busy = true; $('btnScanAll').disabled = true;
  let added = 0, qs = 0; const errs = [];
  for (let i = 0; i < names.length; i++) {
    strip('جاري فحص ' + names[i] + ' (' + (i + 1) + ' من ' + names.length + ')', (i / names.length) * 100);
    try {
      const r = await api('scan', { branch: names[i] });
      added += r.added; qs += r.questions;
      setErr(names[i], null);
    } catch (e) { errs.push(names[i]); setErr(names[i], 'الفحص: ' + arErr(e)); }
  }
  strip(null); st.busy = false; $('btnScanAll').disabled = false;
  await load(true);
  const msg = 'خلص الفحص: ' + added + ' حركة جديدة' + (qs ? ' — منهم ' + qs + ' استفسار' : '') + (errs.length ? ' — ' + errs.length + ' فرع فيه مشكلة (مكتوبة في عموده)' : '');
  toast(msg, errs.length ? 'bad' : 'ok');
}
$('btnScanAll').onclick = () => scanList((st.state ? st.state.branches : []).map(b => b.name));

// ---------- التأكيد: حركة حركة، وكل كارت يبان عليه اللي حصله ----------
function progBox(br) {
  const p = st.cprog[br];
  return '<button class="btn green sm" disabled>' + (p.done < p.n ? 'جاري التسجيل ' + (p.done + 1) + ' من ' + p.n : 'خلص التسجيل') + '</button>' + progLine(br);
}
function progLine(br) {
  const p = st.cprog[br];
  const pct = Math.round(p.done / p.n * 100);
  return '<div class="cprog"><div class="bar"><i style="width:' + pct + '%"></i></div><span>تم ' + p.done + ' من ' + p.n +
    (p.ok ? ' — اتسجّل ' + p.ok : '') + (p.bad ? ' — ما اتسجّلش ' + p.bad : '') + '</span></div>';
}
function paintProgress(br) {
  const p = st.cprog[br];
  const col = Array.from(document.querySelectorAll('.col')).find(c => c.dataset.col === br);
  if (!p || !col) return;
  const box = col.querySelector('.cfm');
  if (box) box.innerHTML = progBox(br);
  let top = col.querySelector('.ptop');
  if (!top) { top = document.createElement('div'); top.className = 'ptop'; col.querySelector('.hd').appendChild(top); }
  top.innerHTML = progLine(br);
  col.querySelectorAll('.pick').forEach(c => {
    c.disabled = true;
    const r = p.res[c.value], card = c.closest('.card');
    if (!r || !card) return;
    let el = card.querySelector('.cstat');
    if (!el) { el = document.createElement('div'); card.insertBefore(el, card.querySelector('.more')); }
    el.className = 'cstat ' + r.cls; el.textContent = r.text;
    card.classList.toggle('c-ok', r.cls === 'ok'); card.classList.toggle('c-bad', r.cls === 'bad');
  });
}
async function confirmBranch(br, btn) {
  if (st.cprog[br]) return;
  const ids = Array.from(document.querySelectorAll('.pick')).filter(c => c.checked && c.dataset.branch === br).map(c => c.value);
  if (!ids.length) return toast('علّم على حركة واحدة على الأقل', 'bad');
  if (!(await ask('تأكيد التسجيل', 'هيتسجّل <b>' + ids.length + '</b> حركة في برنامج <b>' + esc(br) + '</b>، واحدة واحدة.', { yes: 'سجّل' }))) return;
  const p = st.cprog[br] = { n: ids.length, done: 0, ok: 0, bad: 0, res: {}, before: null, after: null };
  paintProgress(br);
  let stop = '';
  for (const id of ids) {
    if (stop) { p.res[id] = { cls: 'bad', text: '✗ ما اتبعتش: ' + stop }; p.bad++; p.done++; paintProgress(br); continue; }
    p.res[id] = { cls: 'run', text: '⏳ بيتسجّل دلوقتي…' };
    paintProgress(br);
    strip('جاري التسجيل في ' + br + ' (' + (p.done + 1) + ' من ' + p.n + ')', p.done / p.n * 100);
    try {
      const r = await api('confirm', { branch: br, ids: [id] });
      if (p.before === null) p.before = r.before;
      p.after = r.after;
      const x = (r.results || []).find(z => z.id === id) || {};
      if (x.status === 'تم') { p.ok++; p.res[id] = { cls: 'ok', text: '✓ اتسجّل: ' + (x.msg || '') }; }
      else { p.bad++; p.res[id] = { cls: 'bad', text: '✗ ما اتسجّلش: ' + (x.msg || x.status || 'حصلت مشكلة') }; }
    } catch (e) {
      const m = arErr(e);
      p.bad++; p.res[id] = { cls: 'bad', text: '✗ ' + m };
      if (e.auth || /الدخول|مفيش نت/.test(m)) stop = m;   // مشكلة دخول أو نت: ما نكملش الباقي
    }
    p.done++;
    paintProgress(br);
  }
  strip(null);
  toast(br + ': اتسجّل ' + p.ok + ' من ' + p.n + (p.bad ? ' — ما اتسجّلش ' + p.bad : '') +
    (p.before !== null ? ' — رصيد خزنة الدعم قبل ' + money(p.before) + ' وبعد ' + money(p.after) : ''),
    (p.bad || Number(p.after) !== 0) ? 'bad' : 'ok');
  setErr(br, stop ? 'التسجيل: ' + stop : null);
  await new Promise(r => setTimeout(r, 1800));   // نسيب النتيجة باينة شوية قبل ما الكروت تنزل «اتعمل النهارده»
  delete st.cprog[br];
  await load(true);
}

async function reject(id) {
  const reason = await ask('تجاهل الحركة', 'الحركة دي مش هتتعكس. اكتب السبب لو حابب:', { input: 'السبب (اختياري)', yes: 'تجاهل', danger: true });
  if (reason === null) return;
  try { await api('reject', { id: id, reason: reason }); toast('الحركة اتشالت', 'ok'); }
  catch (e) { toast(arErr(e), 'bad'); }
  load(true);
}

async function answer(c) {
  const op = c.querySelector('.q-op').value;
  const item = c.querySelector('.q-item').value;
  const rule = c.querySelector('.q-rule').checked;
  const keyword = (c.querySelector('.kw').value || '').trim();
  if (!item) return toast(op === 'تحويل' ? 'اختار الخزنة اللي هيتحوّل منها' : SUP_OPS.includes(op) ? 'اختار المورد' : 'اختار البند الأول. لو مش موجود، ضيفه في البرنامج ودوس «تحديث البنود»', 'bad');
  if (rule && !keyword) return toast('اكتب الكلمة اللي القاعدة هتدوّر عليها', 'bad');
  const btn = c.querySelector('.q-yes'); btn.disabled = true;
  try {
    const r = await api('answer', { id: c.dataset.id, op: op, item: item, saveRule: rule, keyword: keyword });

}

<script>window.MDQ_TOUR_APP = 'tsw';</script>
<script>
/* ========== الجولة الإرشادية المنطوقة (مدقق) ==========
   - الشاشة بتضلّم وتنوّر على حاجة حاجة مع شرح، والشرح بيتقري بصوت مصري (كلام متشكّل)
   - بتظهر كاملة تاني مع كل تحديث للتطبيق (بنقارن تاريخ نشر الصفحة)
   - زرار «؟» يعيد شرح الشاشة اللي انت فيها
   الاستخدام: mdqTour.def('home', [{ el: '#id', t: 'العنوان', b: 'الشرح', s: 'الكلام المنطوق' }, ...])
             mdqTour.maybe('home')  ← بعد ما الشاشة تظهر
             mdqTour.screen = () => 'home'  ← الشاشة الحالية (لزرار ؟) */
(function () {
  const APP = (window.MDQ_TOUR_APP || 'app') + '_';
  const defs = {};
  let running = false;
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  // رقم النسخة = تاريخ نشر الصفحة (بيتغير لوحده مع كل تحديث)
  function ver() {
    const t = Date.parse(document.lastModified);
    if (!t || Math.abs(Date.now() - t) < 60000) return lsGet('mdqTourLastVer_' + APP) || 'x';
    const v = String(Math.floor(t / 60000));
    lsSet('mdqTourLastVer_' + APP, v);
    return v;
  }
  let voice = lsGet('mdqTourVoice') !== '0';
  let arVoice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices().filter(v => /^ar/i.test(v.lang));
      arVoice = vs.find(v => /^ar[-_]EG/i.test(v.lang)) || vs[0] || null;
    } catch (e) {}
  }
  if ('speechSynthesis' in window) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
  const plain = s => String(s || '').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '').replace(/[•☰←→«»"]/g, ' ');
  function speak(step) {
    if (!voice || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(plain(step.s || (step.t + '. ' + step.b)));
      u.lang = arVoice ? arVoice.lang : 'ar-EG'; if (arVoice) u.voice = arVoice;
      u.rate = 0.95; u.volume = 1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function hush() { try { speechSynthesis.cancel(); } catch (e) {} }

  const css = document.createElement('style');
  css.textContent =
    '.mdqt-bg{position:fixed;inset:0;z-index:99990;background:transparent}' +
    '.mdqt-bg.dark{background:rgba(10,26,46,.84)}' +
    '.mdqt-hole{position:fixed;z-index:99991;border:3px solid #FFD54F;border-radius:14px;box-shadow:0 0 0 9999px rgba(10,26,46,.84);pointer-events:none;transition:all .25s}' +
    '.mdqt-b{position:fixed;z-index:99992;left:14px;right:14px;margin:auto;max-width:520px;background:#fff;color:#2B3A4C;border-radius:18px;padding:14px 16px 10px;box-shadow:0 10px 30px rgba(0,0,0,.3);direction:rtl;font-family:inherit;max-height:70vh;display:flex;flex-direction:column}' +
    '.mdqt-h{display:flex;align-items:center;gap:8px}.mdqt-h b{flex:1;font-size:18px;font-weight:900;color:#0B3D6E}' +
    '.mdqt-n{background:#E7F1FB;color:#1479D3;border-radius:20px;padding:2px 9px;font-size:13px;font-weight:700;white-space:nowrap}' +
    '.mdqt-v{border:0;background:#E7F1FB;color:#1479D3;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}.mdqt-v.off{background:#eee;color:#999}' +
    '.mdqt-t{font-size:15.5px;line-height:1.7;white-space:pre-line;overflow:auto;margin:6px 0 8px}' +
    '.mdqt-f{display:flex;align-items:center;gap:8px}.mdqt-f .sp{flex:1}' +
    '.mdqt-f button{font-family:inherit;font-size:15px;font-weight:700;border-radius:12px;padding:9px 16px;cursor:pointer;border:0}' +
    '.mdqt-skip{background:transparent;color:#1479D3}.mdqt-back{background:#fff;border:1.5px solid #C9D9EA!important;color:#1479D3}' +
    '.mdqt-next{background:#1479D3;color:#fff}.mdqt-next.last{background:#2BB45A}' +
    '.mdqt-help{position:fixed;z-index:9000;left:12px;bottom:12px;width:40px;height:40px;border-radius:50%;border:0;background:#1479D3;color:#fff;font-size:20px;font-weight:900;box-shadow:0 4px 14px rgba(20,121,211,.4);cursor:pointer;opacity:.85}';
  document.head.appendChild(css);

  function visible(el) {
    if (!el) return false;
    const r = el.getBoundingClientRect();
    if (r.width < 4 || r.height < 4) return false;
    const cs = getComputedStyle(el);
    return cs.visibility !== 'hidden' && cs.display !== 'none' && el.closest('.hidden') === null;
  }
  const q = sel => { try { return typeof sel === 'string' ? document.querySelector(sel) : sel; } catch (e) { return null; } };

  function run(id, steps) {
    const list = steps.filter(s => s.always || !s.el || visible(q(s.el))).filter(s => !s.el || s.always || visible(q(s.el)));
    if (!list.length) return Promise.resolve();
    running = true;
    return new Promise(resolve => {
      let i = 0;
      const bg = document.createElement('div'); bg.className = 'mdqt-bg';
      const hole = document.createElement('div'); hole.className = 'mdqt-hole';
      const b = document.createElement('div'); b.className = 'mdqt-b';
      document.body.append(bg, hole, b);
      function done() {
        hush(); bg.remove(); hole.remove(); b.remove(); running = false;
        lsSet('mdqTour_' + APP + id, ver());
        window.removeEventListener('resize', place);
        resolve();
      }
      function place() {
        const s = list[i], el = s.el && q(s.el);
        const r = el && visible(el) ? el.getBoundingClientRect() : null;
        if (!r) {
          hole.style.display = 'none'; bg.classList.add('dark');
          b.style.top = '50%'; b.style.bottom = ''; b.style.transform = 'translateY(-50%)';
          return;
        }
        bg.classList.remove('dark'); hole.style.display = '';
        Object.assign(hole.style, { left: (r.left - 6) + 'px', top: (r.top - 6) + 'px', width: (r.width + 12) + 'px', height: (r.height + 12) + 'px' });
        b.style.transform = '';
        const H = window.innerHeight;
        if (H - r.bottom >= r.top) { b.style.top = Math.min(r.bottom + 14, H - 160) + 'px'; b.style.bottom = ''; b.style.maxHeight = Math.max(150, H - r.bottom - 30) + 'px'; }
        else { b.style.bottom = Math.min(H - r.top + 14, H - 160) + 'px'; b.style.top = ''; b.style.maxHeight = Math.max(150, r.top - 30) + 'px'; }
      }
      function go(to) {
        if (to >= list.length) return done();
        i = Math.max(0, to);
        const s = list[i], last = i === list.length - 1, el = s.el && q(s.el);
        b.innerHTML =
          '<div class="mdqt-h"><b></b><span class="mdqt-n">' + (i + 1) + ' من ' + list.length + '</span>' +
          '<button class="mdqt-v' + (voice ? '' : ' off') + '" title="' + (voice ? 'اقفل الصوت' : 'شغّل الصوت') + '">' + (voice ? '🔊' : '🔇') + '</button></div>' +
          '<div class="mdqt-t"></div>' +
          '<div class="mdqt-f">' + (last ? '' : '<button class="mdqt-skip">تخطي الشرح</button>') + '<span class="sp"></span>' +
          (i > 0 ? '<button class="mdqt-back">رجوع</button>' : '') +
          '<button class="mdqt-next' + (last ? ' last' : '') + '">' + (last ? 'تمام، فهمت ✓' : 'التالي') + '</button></div>';
        b.querySelector('b').textContent = s.t;
        b.querySelector('.mdqt-t').textContent = s.b;
        b.querySelector('.mdqt-next').onclick = e => { e.stopPropagation(); go(i + 1); };
        const bk = b.querySelector('.mdqt-back'); if (bk) bk.onclick = e => { e.stopPropagation(); go(i - 1); };
        const sk = b.querySelector('.mdqt-skip'); if (sk) sk.onclick = e => { e.stopPropagation(); done(); };
        b.querySelector('.mdqt-v').onclick = e => {
          e.stopPropagation(); voice = !voice; lsSet('mdqTourVoice', voice ? '1' : '0');
          if (voice) speak(s); else hush();
          go(i);
        };
        if (el && visible(el)) { try { el.scrollIntoView({ block: 'center', behavior: 'instant' }); } catch (e) { el.scrollIntoView(); } }
        place();
        speak(s);
      }
      bg.onclick = () => go(i + 1);
      window.addEventListener('resize', place);
      go(0);
    });
  }

  window.mdqTour = {
    screen: null,
    def(id, steps) { defs[id] = steps; },
    seen(id) { return lsGet('mdqTour_' + APP + id) === ver(); },
    start(id) { if (running || !defs[id]) return Promise.resolve(); return run(id, defs[id]); },
    maybe(id, delay) {
      if (running || !defs[id] || this.seen(id)) return;
      setTimeout(() => { if (!running && !this.seen(id)) this.start(id); }, delay == null ? 600 : delay);
    },
    // زرار ؟: يعيد شرح الشاشة الحالية
    helpButton() {
      const h = document.createElement('button');
      h.className = 'mdqt-help'; h.type = 'button'; h.textContent = '؟'; h.title = 'اشرحلي الشاشة دي';
      h.onclick = () => { const id = window.mdqTour.screen && window.mdqTour.screen(); if (id) window.mdqTour.start(id); };
      document.body.appendChild(h);
      return h;
    },
  };
})();
</script>

    { el: '#board .col', t: 'كارت المحل 🏪', b: 'كل محل ليه عمود: اسمه، وعدد الحركات، ورصيد خزنة الدعم، ولينك البرنامج، وزرار «فحص» للمحل ده بس.',

  const cur = () => ['login', 'main'].find(s => { const e = document.getElementById(s); return e && !e.classList.contains('hidden'); });
  T.screen = cur;
  T.helpButton().style.bottom = '76px';
  const _showLogin = showLogin, _afterLogin = afterLogin;
  showLogin = function () { _showLogin.apply(this, arguments); T.maybe('login', 2600); };
  // الرئيسية: بنستنى الكروت تتحمّل
  afterLogin = function () { _afterLogin.apply(this, arguments); T.maybe('main', 2600); };
  const c = cur(); if (c) T.maybe(c, 2800);
})();
